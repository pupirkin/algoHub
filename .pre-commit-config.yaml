# Fast (< 20 s) by design; Python/TS tools run from the repo's own lockfiles (uv.lock, pnpm-lock.yaml).
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: (tsconfig.*\.json)$
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict (per member)
        entry: tools/hooks/mypy-members.sh
        language: system
        types: [python]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, yaml, css]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [ts, tsx, javascript]
      - id: no-agent-attribution
        name: no Co-Authored-By / tool attribution in commit message
        entry: tools/hooks/check-commit-msg.sh
        language: system
        stages: [commit-msg]
