# P15 migrations (schema `p15`, version table `p15.alembic_version`; ADR-0005).
# Run via `just migrate`; the URL comes from ALGOHUB_DATABASE_URL unless sqlalchemy.url is set programmatically.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
